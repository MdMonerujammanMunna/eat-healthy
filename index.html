<!DOCTYPE html>
<html>

<head>
    <!-- daisyUI and Tailwind cnd link-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font-awesome cnd link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google font cnd Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <!--  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- other link -->
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Eat Fresh</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <style>
        * {
            font-family: "Montserrat", sans-serif;
        }

        .bannerFont {
            font-family: "Monoton", sans-serif;
        }
    </style>
</head>

<body class="container mx-auto">
    <header class="my-[100px]">
        <section class="md:flex justify-between items-center my-[100px]">
            <div class="space-y-10 flex-1">
                <h1 class="bannerFont text-6xl leading-[130%]">
                    <span
                        class="bannerFont bg-linear-to-r from-[#FBA24F] to-[#FF1E1E] text-transparent bg-clip-text">Skip</span>
                    The Diet,<br>
                    Just Eat Healthy <br>
                    With Food Network
                </h1>
                <p class="max-w-[600px] font-medium text-xl text-[#828282]">Imagine you don't need a diet because we
                    provide
                    healthy and delicious food for you!</p>
                <button
                    class="btn text-white bg-linear-to-r from-[#FBA24F] to-[#FF1E1E] px-10 py-6 rounded-full text-[18px] font-semibold">Order
                    Food</button>
            </div>
            <div class="flex-1 relative">
                <img src="./images/shapes/Group 8450.png" alt="" class="">
                <div class="absolute top-0 ">
                    <img src="./images/male/hreo.png" alt="">
                </div>
            </div>
        </section>
    </header>
    <main>
        <section class="mx-[10px] my-[100px]">
            <div
                class="md:flex gap-[30px] items-center justify-between px-[165px] text-center py-[64px] shadow-xl rounded-[8px]">
                <div class="mb-[50px] md:mb-0 ">
                    <h1 class="text-[48px] font-bold mb-2">700K</h1>
                    <p class="text-[#18191F]">Youtube Subscribers</p>
                </div>
                <div class="mb-[50px] md:mb-0 ">
                    <h1 class="text-[48px] font-bold mb-2">2.5M</h1>
                    <p class="text-[#18191F]">Instagram Followers</p>
                </div>
                <div>
                    <h1 class="text-[48px] font-bold mb-2">100K</h1>
                    <p class="text-[#18191F]">Dribble Shot Likes</p>
                </div>
            </div>
        </section>
    </main>
    <!-- footer section -->
    <footer class="bg-black pt-[37px] pb-[115px] text-center">
        <h1
            class="mb-[37px] text-[30px] font-extrabold bg-linear-to-r from-[#FBA24F] to-[#FF1E1E] text-transparent bg-clip-text">
            Eat <span class="text-[#5B5B5B]">
                Fresh</span></h1>
        <p class="text-white">Eat healthy to live healthy. Live healthy to live happy. </p>
    </footer>
</body>

</html>
